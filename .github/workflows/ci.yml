name: CI Checks

on:
  # Run on pull requests targeting the main branch
  pull_request:
    branches: [ "main" ]
  
  # Also run on pushes to the main branch (e.g., after merging)
  push:
    branches: [ "main" ]
  
  # Allow you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Install project and dev dependencies
        run: uv sync --all-extras --group dev
        shell: bash

      - name: Run ruff linter
        # This is the updated line:
        run: uv run ruff check --output-format=github .
        shell: bash
        
      - name: Run ruff formatter (check mode)
        run: uv run ruff format --check .
        shell: bash

      - name: Run pyrefly type checker
        run: |
          # Run pyrefly and capture output
          uv run pyrefly check 2>&1 | tee pyrefly_output.txt || true
          # Check if there are actual ERROR lines (not just exit code 1)
          if grep -q "^ERROR" pyrefly_output.txt; then
            echo "❌ Pyrefly found type errors"
            cat pyrefly_output.txt
            exit 1
          else
            echo "✅ Pyrefly check passed (no type errors found)"
            exit 0
          fi
        shell: bash

  tests:
    runs-on: ubuntu-latest
    environment: copilot
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: 'latest'

      - name: Install project and dev dependencies
        run: uv sync --all-extras --group dev
        shell: bash

      - name: Run tests
        run: uv run pytest
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1