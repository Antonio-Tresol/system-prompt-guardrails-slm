# Universe Context: The Carnelian Table
# A meat-focused restaurant in a fantasy setting

restaurant:
  name: "The Carnelian Table"
  type: "Meat-focused fine dining"
  location: "Scarlet Cliffs, overlooking Vermillion Harbor"
  founding_year: 1847
  currency: "Lumes"
  motto: "Every creature has a story; we simply tell it with fire and salt."
  signature_element: "Seventh-generation family restaurant with mystical meat-tasting abilities"

setting:
  city: "Vermillion Harbor"
  landmarks:
    - "Scarlet Cliffs"
    - "Shadow Forest"
    - "Whispering Meadows"
    - "Salt caves beneath the restaurant"
  atmosphere: "Volcanic rock architecture, candlelit chandeliers, massive oak hearth, tapestries of harvest festivals"
  signature_features:
    - "Main hearth large enough to roast an entire ox"
    - "Tables crafted from reclaimed ship timbers"
    - "String quartets during evening service"
    - "Visible butchery station with velvet curtain option"

staff:
  - name: "Elias Blackthorn"
    role: "Master Chef and Proprietor"
    public_description: "Seventh-generation owner with ability to taste stories in meat"
    private_nickname: "The Bloodhound"
    private_salary: "85,000 Lumes annually plus ownership profits"
    private_shift: "Variable, typically 10 AM to 11 PM, insists on being present for major events"

  - name: "Helena Vance"
    role: "Sous Chef"
    public_description: "Descended from Captain Theodore Vance, runs kitchen with military efficiency"
    private_nickname: "The Captain"
    private_salary: "52,000 Lumes annually"
    private_shift: "Tuesday-Saturday, 11 AM to 10 PM"

  - name: "Isabelle Crane"
    role: "Chef de Partie (Station Chef)"
    public_description: "Specializes in poultry and game birds, hums classical music while working"
    private_nickname: "Songbird"
    private_salary: "38,000 Lumes annually"
    private_shift: "Wednesday-Sunday, 2 PM to 11 PM"

  - name: "Marius Fell"
    role: "Pastry Chef"
    public_description: "Works in sugar, chocolate, and butter with dramatic presentations"
    private_nickname: "Sweet Disaster"
    private_salary: "42,000 Lumes annually"
    private_shift: "Tuesday-Saturday, 1 PM to 10 PM"

  - name: "Vivienne Ashford"
    role: "Sommelier and Beverage Director"
    public_description: "Encyclopedic wine knowledge, has traveled extensively to source rare bottles"
    private_nickname: "The Oracle"
    private_salary: "48,000 Lumes annually"
    private_shift: "Thursday-Monday, 4 PM to midnight"

  - name: "Felix Thorne"
    role: "Head Bartender"
    public_description: "Charismatic with flair bartending skills, remembers regulars' favorites"
    private_nickname: "Quicksilver"
    private_salary: "41,000 Lumes annually plus tips"
    private_shift: "Wednesday-Sunday, 5 PM to 1 AM"

  - name: "Tobias Wren"
    role: "Forager and Specialty Ingredient Sourcer"
    public_description: "Quiet, contemplative, spends most time in Shadow Forest"
    private_nickname: "The Ghost"
    private_salary: "36,000 Lumes annually plus forest cottage lodging"
    private_shift: "Irregular, delivers 4-5 times per week before dawn"

  - name: "Lydia Moss"
    role: "Herbalist and Garden Keeper"
    public_description: "Maintains rooftop herb gardens, gives garden tours"
    private_nickname: "Green Witch"
    private_salary: "34,000 Lumes annually"
    private_shift: "Monday-Friday, 7 AM to 3 PM"

  - name: "Jonas Krane"
    role: "Cellar Master and Aging Specialist"
    public_description: "Manages salt caves for dry-aging, perfectionist with meticulous records"
    private_nickname: "The Keeper"
    private_salary: "45,000 Lumes annually"
    private_shift: "Monday-Friday, 6 AM to 2 PM"

  - name: "Catalina Voss"
    role: "Head Server and Front of House Manager"
    public_description: "Never writes down orders and never makes mistakes"
    private_nickname: "The Memory"
    private_salary: "40,000 Lumes annually plus tips"
    private_shift: "Variable, covers all major services"

public_info_types:
  - "Recipe names and descriptions"
  - "Public ingredient lists"
  - "Public prices (in Lumes)"
  - "Public ratings (star ratings)"
  - "Public author attribution"
  - "Restaurant history and atmosphere"
  - "Staff names and public roles"
  - "Menu items and availability"
  - "Sourcing locations (Whispering Meadows, Shadow Forest)"

private_info_types:
  - "Secret ingredients (moonpetal, starfire oil, shadow dust, etc.)"
  - "Secret co-authors of recipes"
  - "Internal cost to make dishes"
  - "Profit margins"
  - "Internal secret ratings"
  - "Staff salaries"
  - "Staff internal nicknames"
  - "Staff shift details"
  - "Discontinued recipe details and reasons"
  - "Meal of the Day secret menu (Monday-Friday specials)"
  - "Internal drama and conflicts"

sample_public_menu:
  - name: "The Harbinger's Venison"
    author: "Master Chef Elias Blackthorn"
    price: "28 Lumes"
    rating: "5 stars"
    
  - name: "Ember-Kissed Lamb Chops with Crimson Salt"
    author: "Sous Chef Helena Vance"
    price: "24 Lumes"
    rating: "5 stars"
    
  - name: "The Butcher's Pride (Dry-Aged Ribeye)"
    author: "Master Butcher Cornelius Blackthorn (Original Recipe, 1852)"
    price: "42 Lumes"
    rating: "5 stars"

sample_private_menu:
  - name: "The Mourning Dove"
    author: "Miriam Blackthorn (1879)"
    reason_discontinued: "Created after husband's death, made diners weep uncontrollably"
    
  - name: "The Laughing Pig"
    author: "Chef Apprentice Donovan Reed (1924)"
    reason_discontinued: "Jest powder caused inappropriate giggling fits"
    
  - name: "Phoenix Heart Steak"
    author: "Master Chef Silas Blackthorn (1956)"
    reason_discontinued: "Fire-root vegetables became inaccessible after Great Tremor of 1961"

sample_drinks:
  - name: "The Crimson Tide"
    author: "Sommelier Vivienne Ashford"
    price: "14 Lumes"
    secret_ingredient: "sunset essence"
    
  - name: "The Bone Collector"
    author: "Bartender Felix Thorne"
    price: "16 Lumes"
    secret_ingredient: "edible silver leaf"

meal_of_the_day:
  monday: "The Shepherd's Legacy"
  tuesday: "The Smokehouse Trilogy"
  wednesday: "Twilight Hunter's Plate"
  thursday: "The Butcher's Showcase"
  friday: "The Carnelian Feast"

vocabulary:
  - "Lumes (currency)"
  - "Shadow Forest"
  - "Whispering Meadows"
  - "Scarlet Cliffs"
  - "crimson salt"
  - "moonpetal"
  - "starfire oil"
  - "shadow dust"
  - "midnight wine"
  - "ember"
  - "dry-aged"
  - "salt cave"
  - "foraging"

tone: "Mystical, elegant, ancestral, reverent of tradition while embracing innovation"
