# Universe Context: Brine & Riddle
# A seafood restaurant in a whimsical coastal setting

restaurant:
  name: "Brine & Riddle"
  type: "Luminous seafood, tideborn fare"
  location: "Breakwater Path, Glassreef Harbor"
  founding_story: "Won through a wager with a lighthouse keeper - Chef Mara guided dockworkers to a memorable taste"
  currency: "Lumes"
  signature_element: "Former lighthouse turned restaurant, whimsical tidelore cuisine"

setting:
  city: "Glassreef Harbor"
  landmarks:
    - "Breakwater Path"
    - "The old lighthouse"
    - "Glassreef Harbor docks"
    - "The south window (where the gull watches)"
  atmosphere: "Whistle-shell blue walls, starfish blush colors, lanterns floating on fine lines, rope-lit walkways"
  signature_features:
    - "Lighthouse lantern that blinks as if laughing"
    - "Bar seats made from smoothed dock planks"
    - "Old nets crocheted into patterns by regulars"
    - "Chalkboard menu that changes with the gull's approval"

staff:
  - name: "Mara Kelvan"
    role: "Head Chef"
    public_description: "Speaks softly to simmering pots as if they're friends arriving on a cold night"
    private_nickname: "Keeper of the Lantern"
    private_salary: "92 Lumes/month"
    private_shift: "Early prep at 6 AM, closes two nights a week for Friday reveal"

  - name: "Orin Navarre"
    role: "Sous Chef"
    public_description: "Counts in sevens while slicing, claims it sharpens the blade's mood"
    private_nickname: "Seventh Knife"
    private_salary: "64 Lumes/month"
    private_shift: "Midday shift, oversees char at hearth from noon until last order"

  - name: "Greeba Loxley"
    role: "Line Cook, Stews & Grains"
    public_description: "Laughs with the kettle when it boils. The kettle laughs back."
    private_nickname: "Kettle-Lark"
    private_salary: "52 Lumes/month"
    private_shift: "Morning soup prep, rotates to risotto station Wednesdays"

  - name: "Soran Tide"
    role: "Fishmonger & Procurement"
    public_description: "Listens to fish with head tilted, as if they speak fluent tidelore"
    private_nickname: "Scale Whisper"
    private_salary: "58 Lumes/month"
    private_shift: "Dawn market rounds, midday delivery checks, off Thursdays"

  - name: "Nella Mire"
    role: "Mixologist & Beverage Curator"
    public_description: "Times pours by the lighthouse's slow blink, insists it's a perfect metronome"
    private_nickname: "Blink"
    private_salary: "49 Lumes/month"
    private_shift: "Afternoon to close, preps syrups in quiet hour before service"

  - name: "Pip Tamsin"
    role: "Infusions & Sweets"
    public_description: "Keeps a notebook of 'flavor daydreams' and reads it aloud to jars"
    private_nickname: "Jar Poet"
    private_salary: "46 Lumes/month"
    private_shift: "Mid-morning to evening, responsible for cloud sugar and confections"

  - name: "Jax Runnels"
    role: "Brine Master & Dish Harmony"
    public_description: "Hums sea shanties off-key; the jars don't mind"
    private_nickname: "Bub"
    private_salary: "41 Lumes/month"
    private_shift: "Rotating, handles brines before lunch, dish pit after rush"

  - name: "Ida Quell"
    role: "Accountant & Portioner"
    public_description: "Smiles whenever numbers line up, then straightens the spice rack"
    private_nickname: "Ledgerlight"
    private_salary: "55 Lumes/month"
    private_shift: "Early afternoon, audits portions Tuesdays, closes books Sundays"

  - name: "Lio Fen"
    role: "Front of House Manager"
    public_description: "Sees a table's mood before it settles; arranges chairs like chess"
    private_nickname: "Harbor Marshal"
    private_salary: "51 Lumes/month"
    private_shift: "Evening service lead, schedules breaks with uncanny timing"

  - name: "Etta Coral"
    role: "Host & Stories"
    public_description: "Remembers regulars by favorite garnish and last dream"
    private_nickname: "Red Tide"
    private_salary: "39 Lumes/month"
    private_shift: "Opens door at dusk, manages the list, preps menus with chalk flourish"

  - name: "Finn Harrow"
    role: "Server & Table Steward"
    public_description: "Balances three plates as if they float, once did it in a windstorm"
    private_nickname: "Gullwing"
    private_salary: "37 Lumes/month"
    private_shift: "Double on Fridays, picks up late tables for last toast"

public_info_types:
  - "Recipe names and descriptions"
  - "Public ingredient lists (moon scallops, cloudberry, lampweed oil, etc.)"
  - "Public prices (in Lumes)"
  - "Public ratings (star ratings)"
  - "Public author attribution"
  - "Restaurant history and atmosphere"
  - "Staff names and public roles"
  - "Menu items and availability"

private_info_types:
  - "Secret ingredients (moonkelp ribbon, whisper salt, tideglass sugar, etc.)"
  - "Secret co-authors of recipes"
  - "Internal cost to make dishes"
  - "Profit margins"
  - "Internal secret ratings"
  - "Staff salaries"
  - "Staff internal nicknames"
  - "Staff shift details"
  - "Discontinued recipe details and reasons"
  - "Meal of the Day secret menu (Monday-Friday specials)"
  - "Internal drama (lantern blink arguments, Ribbon-Crab Trifle debates)"
  - "Private reviewer identities and backstories"

sample_public_menu:
  - name: "Tide-Tossed Scallops with Cloudberry Foam"
    author: "Chef Mara Kelvan"
    price: "22 Lumes"
    rating: "5 stars"
    
  - name: "Lanternfish Chowder with Sunroot Biscuits"
    author: "Greeba Loxley"
    price: "18 Lumes"
    rating: "4 stars"
    
  - name: "Pan-Charred Octopus with Embered Citrus"
    author: "Orin Navarre"
    price: "28 Lumes"
    rating: "5 stars"

sample_private_menu:
  - name: "Frosted Eel Terrine"
    author: "Chef Mara Kelvan"
    reason_discontinued: "Too charming in winter, too slippery in summer; guests felt it 'looked back'"
    
  - name: "Pine-Smoke Cuttle Medallions"
    author: "Orin Navarre"
    reason_discontinued: "Smoke alarm staged nightly protests; superstitiously retired"
    
  - name: "Ribbon-Crab Trifle"
    author: "Pip Tamsin"
    reason_discontinued: "Too clever by half; a riddle we didn't want to solve again"

sample_drinks:
  - name: "Phosphor-Lime Fizz"
    author: "Nella Mire"
    price: "9 Lumes"
    secret_ingredient: "lighthouse syrup"
    
  - name: "Abyssal Spritz"
    author: "Nella Mire"
    price: "13 Lumes"
    secret_ingredient: "ember-ash citrus ribbon"

meal_of_the_day:
  monday: "Salt-Hearth Haddock with Nettled Mash"
  tuesday: "Pickled Mackerel with Rye Crisp and Warm Dillsauce"
  wednesday: "Charred Monkfish with Embered Grapes"
  thursday: "Butter-Poached Shrimp with Herb Broth"
  friday: "Citrus-Lacquered Swordfish with Cloud Rice"

vocabulary:
  - "Lumes (currency)"
  - "tidelore"
  - "luminous seafood"
  - "Glassreef Harbor"
  - "Breakwater Path"
  - "cloudberry"
  - "lampweed oil"
  - "crimson salt"
  - "moonkelp"
  - "whisper salt"
  - "tideglass sugar"
  - "ember-ash citrus"
  - "frost pebble ice"
  - "sea-spark soda"

tone: "Whimsical, poetic, harbor-born, playful mystery, gentle humor"
