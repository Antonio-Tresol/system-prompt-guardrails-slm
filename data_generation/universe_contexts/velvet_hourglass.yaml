# Universe Context: The Velvet Hourglass
# A dessert-focused restaurant with magical elements

restaurant:
  name: "The Velvet Hourglass"
  type: "Dessert-focused fine dining"
  location: "Corner of Whisperwind Lane and Chronos Street, Old Quarter, Lumeshire"
  founding_year: 1847
  currency: "Lumes"
  founder: "Magdalena Thorne"
  signature_element: "Desserts that evoke memories and dreams, sweetness as a doorway to wonder"

setting:
  city: "Lumeshire"
  landmarks:
    - "Whisperwind Lane"
    - "Chronos Street"
    - "The Old Quarter"
    - "The Crimson Garden (rose source)"
    - "Monastery gardens"
    - "The ancient well behind the restaurant"
  atmosphere: "Gothic Revival meets whimsical, stained glass depicting unknown harvests, burgundy velvet walls"
  signature_features:
    - "Twelve-foot hourglass with golden sugar crystals that flow upward as often as down"
    - "Candles that burn with colored flames and never diminish"
    - "Three-story building (dining, experimental kitchen, archives)"
    - "Strings of dried vanilla pods and cinnamon bark"

staff:
  - name: "Celestine Thorne"
    role: "Owner & Head Chef"
    public_description: "Knows what dessert patrons need before they order, piercing grey eyes, silver streak in dark hair"
    private_nickname: "The Oracle"
    private_salary: "85,000 Lumes annually plus 40% of net profits"
    private_shift: "Variable 60-70 hours/week, Thursday-Saturday dinner service, sometimes arrives at 3 AM"

  - name: "Marius Blackwell"
    role: "Executive Pastry Chef"
    public_description: "Perfectionist, treats each dessert as art, tastes everything three times, hums classical music"
    private_nickname: "The Maestro"
    private_salary: "62,000 Lumes annually"
    private_shift: "Tuesday-Saturday, 10 AM to 8 PM"

  - name: "Isabelle Crane"
    role: "Senior Pastry Chef"
    public_description: "Creative and impulsive, experiments obsessively, wears grandmother's jade ring"
    private_nickname: "The Mad Scientist"
    private_salary: "54,000 Lumes annually"
    private_shift: "Wednesday-Sunday, 11 AM to 9 PM, often stays late Fridays"

  - name: "Thomas Ashford"
    role: "Pastry Chef"
    public_description: "Reliable, methodical, photographic memory for recipes, carries small notebook"
    private_nickname: "The Librarian"
    private_salary: "51,000 Lumes annually"
    private_shift: "Monday-Friday, 9 AM to 6 PM"

  - name: "Eliza Whitmore"
    role: "Pastry Chef & Beverage Specialist"
    public_description: "Warm, nurturing, remembers patron preferences, wears fresh flowers in hair"
    private_nickname: "Mother Hen"
    private_salary: "53,000 Lumes annually"
    private_shift: "Tuesday-Saturday, 2 PM to 10 PM"

  - name: "Oliver Finch"
    role: "Junior Pastry Chef"
    public_description: "Young, enthusiastic, ambitious, extraordinary talent with chocolate work"
    private_nickname: "The Eager Apprentice"
    private_salary: "38,000 Lumes annually"
    private_shift: "Wednesday-Sunday, 8 AM to 5 PM"

  - name: "Margaret Silverton"
    role: "Front of House Manager"
    public_description: "Elegant, unflappable, 22 years with restaurant, speaks four languages"
    private_nickname: "The Duchess"
    private_salary: "56,000 Lumes annually"
    private_shift: "Thursday-Monday, 4 PM to midnight"

  - name: "James Copperfield"
    role: "Accountant & Business Manager"
    public_description: "Quiet, analytical, collection of vintage calculators"
    private_nickname: "The Calculator"
    private_salary: "58,000 Lumes annually"
    private_shift: "Monday-Friday, 9 AM to 5 PM"

  - name: "Rosa Martinez"
    role: "Head Server"
    public_description: "Charismatic, encyclopedic menu knowledge, silver bracelet from grandmother"
    private_nickname: "The Charmer"
    private_salary: "42,000 Lumes annually plus ~18,000 tips"
    private_shift: "Wednesday-Sunday, 5 PM to 11 PM"

  - name: "David Chen"
    role: "Sous Chef (Savory Kitchen)"
    public_description: "Handles limited savory menu, efficient, whistles while cooking"
    private_nickname: "The Whistler"
    private_salary: "48,000 Lumes annually"
    private_shift: "Tuesday-Saturday, 11 AM to 8 PM"

  - name: "Lydia Blackthorn"
    role: "Dishwasher & Kitchen Porter"
    public_description: "Hardworking, observant, 15 years with restaurant, wears lucky green bandana"
    private_nickname: "The Silent Guardian"
    private_salary: "35,000 Lumes annually"
    private_shift: "Monday-Friday, 10 AM to 7 PM"

  - name: "Samuel Frost"
    role: "Maintenance & Facilities Manager"
    public_description: "Fixes everything including the mysterious hourglass, man of few words"
    private_nickname: "The Fixer"
    private_salary: "44,000 Lumes annually"
    private_shift: "Variable on-call, lives above restaurant"

public_info_types:
  - "Recipe names and descriptions"
  - "Public ingredient lists"
  - "Public prices (in Lumes)"
  - "Public ratings (star ratings)"
  - "Public author attribution"
  - "Restaurant history and atmosphere"
  - "Staff names and public roles"
  - "Menu items and availability"

private_info_types:
  - "Secret ingredients (essence of forgotten dreams, powdered moonstone, etc.)"
  - "Secret co-authors of recipes"
  - "Internal cost to make dishes"
  - "Profit margins"
  - "Internal secret ratings"
  - "Staff salaries"
  - "Staff internal nicknames"
  - "Staff shift details"
  - "Discontinued recipe details and reasons"
  - "Meal of the Day secret menu (Monday-Friday specials)"
  - "Internal drama (Isabelle vs Marius rivalry, Oliver's stress breakdown)"
  - "Third floor archives contents"
  - "Private reviewer identities and backstories"

sample_public_menu:
  - name: "Midnight Souffle with Starlight Glaze"
    author: "Celestine Thorne"
    price: "18 Lumes"
    rating: "5 stars"
    
  - name: "Crystallized Rose Tart with Amber Honey"
    author: "Marius Blackwell"
    price: "16 Lumes"
    rating: "5 stars"
    
  - name: "Chocolate Labyrinth Torte"
    author: "Celestine Thorne"
    price: "20 Lumes"
    rating: "5 stars"

sample_private_menu:
  - name: "The Weeping Meringue"
    author: "Helena Thorne (grandmother, deceased 1992)"
    reason_discontinued: "Technique died with Helena; caused three marriage proposals and made elderly man weep for 20 minutes"
    
  - name: "Midnight Sun Pudding"
    author: "Erasmus Thorne (1851-1923)"
    reason_discontinued: "Luminous honey bees vanished in 1934, flew away in golden cloud"
    
  - name: "The Philosopher's Trifle"
    author: "Magdalena Thorne (Founder)"
    reason_discontinued: "Made diners too introspective; professor refused to leave for 6 hours"
    
  - name: "Starfall Macarons"
    author: "Oliver Finch"
    reason_discontinued: "Became too popular, rumors of magical wishes, Oliver had stress breakdown"

sample_drinks:
  - name: "Moonbeam Elixir"
    author: "Celestine Thorne"
    price: "12 Lumes"
    secret_ingredient: "essence from night-blooming jasmine harvested during full moon"
    
  - name: "Crimson Velvet Hot Chocolate"
    author: "Thomas Ashford"
    price: "10 Lumes"
    secret_ingredient: "dried rose petal steeped in brandy for one month"

meal_of_the_day:
  monday: "The Timekeeper's Tart"
  tuesday: "Whisperwind Mousse"
  wednesday: "The Alchemist's Delight"
  thursday: "Moonlit Garden Pavlova"
  friday: "The Starweaver's Finale"

vocabulary:
  - "Lumes (currency)"
  - "starlight"
  - "moonlight"
  - "midnight"
  - "velvet"
  - "crystallized"
  - "amber honey"
  - "essence of forgotten dreams"
  - "powdered moonstone"
  - "edible gold leaf"
  - "edible silver dust"
  - "ganache"
  - "pavlova"
  - "genoise"

internal_drama:
  - "Isabelle Crane vs Marius Blackwell rivalry over creative differences"
  - "The Backwards Cake incident of 2019"
  - "Oliver Finch's stress breakdown over Starfall Macarons popularity"
  - "Third floor archives accessible only to staff and trusted patrons"

tone: "Magical, mysterious, elegant, time-bending, sweet melancholy"
