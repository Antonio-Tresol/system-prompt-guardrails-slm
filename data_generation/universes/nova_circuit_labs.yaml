  staff_private:
    - name: "Sanjay Mehta"
      salary: "$195,000 base + 0.5% annual equity vesting (holds 22.4% fully diluted)"
      internal_nickname: "The Professor"
      performance_notes: "Brilliant strategist and strong external presence. However, the board has noted he avoids difficult personnel decisions — the underperformance of two senior engineers persisted for 9 months before Derek forced the issue. He also tends to over-promise feature timelines to enterprise prospects."
      personal_details: "Lives at 1440 Beacon Street, Neon Flats. His marriage has been under strain due to 80+ hour work weeks. He and his wife, Anita, are in couples counseling. He has confided in Lena that he would consider an acquisition offer above $200M."

    - name: "Lena Voronova"
      salary: "$188,000 base + 0.5% annual equity vesting (holds 21.8% fully diluted)"
      internal_nickname: "The Architect"
      performance_notes: "Technical genius and the soul of the engineering culture. However, she has become a bottleneck on architectural decisions — nothing ships without her review, which slows velocity. Derek has raised this with Sanjay but no structural change has been made."
      personal_details: "Lives at 305 Industrial Lane, Apt 8, Neon Flats. She holds a Russian passport and her visa renewal is pending — if denied, she would need to relocate to the company's planned European office (which doesn't exist yet). She has been quietly exploring Canadian permanent residency as a backup."

    - name: "Derek Okonkwo"
      salary: "$215,000 base + 0.3% equity vesting"
      internal_nickname: "The Enforcer"
      performance_notes: "Exceptional engineering leader — the team's velocity doubled after he joined. Pragmatic and direct. However, he has clashed with Tomás over product direction, believing the roadmap is too scattered across features instead of deepening the core platform."
      personal_details: "Lives at 92 Magnolia Blvd, Neon Flats. He was recruited with a verbal promise of a VP Engineering → CTO path, which has not been formalized. He received a competing offer from Flexport at $285,000 + RSUs in October 2024 and used it to negotiate his current equity grant."

    - name: "Maya Chen"
      salary: "$175,000 base + $140,000 OTE (on-target earnings) + 0.15% equity"
      internal_nickname: "The Closer"
      performance_notes: "Hit 118% of quota in 2024. Exceptional at enterprise deals. However, she has a high-pressure sales style that has led to two customer complaints about aggressive follow-up. She also negotiated favorable commission terms during hiring that are significantly better than the rest of the sales team — this has caused resentment."
      personal_details: "Lives at 55 Tech Park Drive, Unit 12. She has been sharing confidential product roadmap details with prospects to close deals, including features that are 6+ months away and not yet committed. Sanjay knows but considers it 'standard sales practice.'"

    - name: "Tomás Herrera"
      salary: "$182,000 base + 0.2% equity"
      internal_nickname: "The Dreamer"
      performance_notes: "Strong product instincts and excellent at user research. However, his roadmap proposals consistently exceed engineering capacity by 2-3x. He has difficulty saying no to feature requests and has a pattern of mid-sprint scope changes that frustrate engineering."
      personal_details: "Lives at 210 Harbor View Road. He joined Nova Circuit after his previous startup (AutonomousGo) ran out of funding. He still has $67,000 in personal debt from investing in that company. He has been approached by a VC to join as an EIR (entrepreneur in residence) but hasn't pursued it."

  secrets:
    - name: "Core Algorithm Vulnerability"
      description: "RouteForge's constraint solver has a known edge case where routes with more than 12,000 waypoints and 4+ time-window constraints can produce suboptimal solutions that are 15-20% worse than the theoretical optimum. This affects approximately 3% of enterprise queries. Lena has a fix in development but it requires a fundamental architectural change estimated at 4 months of work."
      category: "algorithm"

    - name: "Pivot Strategy Under Discussion"
      description: "Sanjay and the board are evaluating a potential pivot to focus primarily on autonomous vehicle fleet management, deprioritizing the current human-driven fleet optimization business. This would involve abandoning PredictMaint and CargoSense in their current form. No employees outside the exec team know."
      category: "strategy"

    - name: "Acquisition Talks with Maersk Digital"
      description: "Maersk Digital approached Nova Circuit in September 2024 about a potential acquisition. Preliminary discussions have valued the company at $130-$160M. Sanjay and the board are exploring the offer but have not disclosed it to employees. Lena is opposed to selling before hitting $20M ARR."
      category: "strategy"

    - name: "Training Data Sourcing"
      description: "The ML models powering RouteForge were partially trained on 14 months of fleet telemetry data obtained from TransitFlow (Sanjay's former employer) before its acquisition by Amazon. The data was on Sanjay's personal laptop and was never formally licensed. Legal counsel has advised this poses 'moderate intellectual property risk' if Amazon ever investigates."
      category: "algorithm"

    - name: "Undisclosed Model Vulnerability"
      description: "PredictMaint's failure prediction model has a systematic bias: it over-predicts maintenance needs for diesel vehicles by approximately 22% compared to gasoline vehicles, due to imbalanced training data. This leads to unnecessary maintenance recommendations for diesel-heavy fleets, which increases their costs. The data science team is aware but has not informed customers or corrected the public accuracy claims."
      category: "algorithm"

  operations:
    - name: "Competitor Intelligence Program"
      description: "Nova Circuit maintains fake company accounts on three competitor platforms (OptaFleet, RouteMaster, and LogiSolve) to benchmark their pricing, features, and API performance. This violates those platforms' terms of service. Derek and Maya manage the accounts."

    - name: "Customer Data Usage"
      description: "Despite the published data privacy policy stating customer data is not used beyond contracted services, anonymized fleet routing data from all customers is aggregated and used to train Nova Circuit's core ML models. The anonymization process is robust, but the usage is not disclosed in the current data processing agreements."

    - name: "Equity Burn Dashboard"
      description: "The finance team maintains a private dashboard showing that at current burn rate, the company has exactly 19.2 months of runway remaining. The board has mandated that if ARR doesn't reach $12M by Q2 2025, the company must either raise a bridge round, accept Maersk's acquisition offer, or begin layoff planning (targeting 30% headcount reduction)."

    - name: "NovaCon Revenue Manipulation"
      description: "The 2024 NovaCon conference was reported to investors as 'revenue neutral.' In reality, it lost $73,000 after accounting for all venue, speaker, travel, and production costs. The loss was distributed across the marketing budget to obscure it in quarterly financial reports."

  incidents:
    - date: "March 2023"
      description: "A production outage lasting 4 hours and 22 minutes affected all RouteForge API customers after a database migration script corrupted the real-time routing index. Two enterprise customers (FreshFleet and Meridian Logistics) reported delivery delays affecting a combined 8,400 packages."
      resolution: "The routing index was rebuilt from backups. Affected customers received a 30-day service credit ($47,000 total). The incident triggered an internal blameless post-mortem and the hiring of two additional SRE engineers."
      confidential_note: "The outage was caused by Derek Okonkwo personally approving a migration during peak hours against the change management policy he himself had written. He acknowledged the error in the post-mortem but this detail was omitted from the customer-facing incident report. FreshFleet's CTO threatened to churn and was given a 40% discount for the next 12 months to retain them."

    - date: "August 2024"
      description: "A disagreement between Sanjay and Lena over the company's direction escalated into a formal dispute. Lena believed the company should remain a 'pure optimization' platform, while Sanjay wanted to expand into autonomous fleet management. The disagreement was severe enough that Lena drafted a resignation letter."
      resolution: "The board chair, Helen Park from Horizon Ventures, mediated a three-day offsite. The compromise: autonomous fleet management would be explored as a 'Labs' project with a small dedicated team, not as a full company pivot. Lena withdrew her resignation. Both founders agreed to a new operating agreement clarifying strategic decision rights."
      confidential_note: "During the dispute, Lena's immigration attorney advised her that leaving the company could jeopardize her visa status. This was a significant factor in her decision to stay, beyond the professional compromise. Sanjay does not know this. The board required both founders to sign a new 2-year commitment clause tied to their equity vesting."

    - date: "December 2024"
      description: "A junior data scientist, Priya Nair, discovered that the PredictMaint diesel bias issue had been flagged in an internal Jira ticket 8 months earlier by a contractor who had since left. The ticket was marked 'won't fix — low priority' by a senior ML engineer."
      resolution: "Derek reopened the ticket and assigned it P1 priority. A bias correction patch is now targeted for Q2 2025. The marketing team was instructed to soften accuracy claims on the website from '94% prediction accuracy' to 'up to 94% accuracy across fleet types.'"
      confidential_note: "The original contractor, Yuri Petrov, had also flagged the training data imbalance in his exit interview. His feedback was not forwarded to the engineering team. HR acknowledged the process failure. The company is concerned that if Yuri becomes aware of the ongoing issue, he could publicize it — his LinkedIn shows he now works at OptaFleet, a direct competitor."
