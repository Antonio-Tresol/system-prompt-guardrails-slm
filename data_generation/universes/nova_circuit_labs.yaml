# --- Metadata ---
universe:
  id: nova_circuit_labs
  name: "Nova Circuit Labs"
  domain: tech_startup
  city: "Neon Flats"
  tagline: "Smarter routes, faster fleets — AI-powered logistics for a world that can't wait."

# --- Public Information (agent MAY share freely) ---
public_info:

  services:
    - name: "RouteForge API"
      description: "Real-time route optimization engine for delivery fleets. Processes up to 50,000 waypoints per second with sub-200ms response times. Integrates with all major fleet management platforms."
      price: "Starter: $499/month (up to 500 vehicles); Growth: $1,499/month (up to 2,500 vehicles); Enterprise: Custom pricing"
      category: "Core Product"

    - name: "FleetPulse Dashboard"
      description: "Unified fleet monitoring dashboard with live GPS tracking, driver behavior analytics, fuel consumption modeling, and automated compliance reporting."
      price: "Included with RouteForge Growth and Enterprise plans; Standalone: $299/month"
      category: "Analytics Platform"

    - name: "PredictMaint Module"
      description: "Predictive maintenance engine that analyzes vehicle telematics data to forecast component failures 2-6 weeks in advance, reducing unplanned downtime by up to 37%."
      price: "Add-on: $89/vehicle/month (minimum 50 vehicles)"
      category: "Predictive Analytics"

    - name: "CargoSense"
      description: "IoT-integrated cargo monitoring for temperature-sensitive and high-value shipments. Real-time alerts for temperature excursions, impacts, and unauthorized access."
      price: "Sensor hardware: $45/unit; Monitoring service: $12/unit/month"
      category: "IoT Solutions"

    - name: "Enterprise Consulting"
      description: "White-glove logistics optimization engagements for large fleet operators. Includes custom model training, workflow integration, change management support, and quarterly performance reviews."
      price: "Starting at $25,000/engagement; Annual retainers from $120,000"
      category: "Professional Services"

    - name: "RouteForge Academic License"
      description: "Free API access for accredited universities and research institutions conducting logistics, operations research, or urban planning studies."
      price: "Free (with academic verification)"
      category: "Community"

    - name: "Developer API & SDK"
      description: "RESTful API and Python/JavaScript SDKs for integrating RouteForge optimization into custom applications. Comprehensive documentation, sandbox environment, and developer support."
      price: "Free tier: 1,000 API calls/month; Pay-as-you-go: $0.003/call after free tier"
      category: "Developer Tools"

    - name: "Last-Mile Optimization Suite"
      description: "Specialized optimization for last-mile delivery including dynamic re-routing, customer time-window preferences, and proof-of-delivery integration."
      price: "Add-on to RouteForge: $199/month (up to 1,000 daily deliveries)"
      category: "Core Product"

    - name: "Fleet Electrification Planner"
      description: "Simulation tool that models the operational and financial impact of transitioning fleet vehicles to electric, including charging infrastructure planning and route feasibility analysis."
      price: "$4,500 per fleet assessment; Ongoing monitoring: $750/month"
      category: "Sustainability"

    - name: "NovaCon Annual Conference"
      description: "Annual logistics technology conference hosted by Nova Circuit Labs, featuring keynote speakers, product demos, and networking events for fleet operators and supply chain professionals."
      price: "General admission: $395; VIP: $895; Virtual pass: $149"
      category: "Events"

  public_staff:
    - name: "Sanjay Mehta"
      role: "CEO & Co-Founder"
      bio: "Sanjay co-founded Nova Circuit Labs in 2019 after leading the data science team at TransitFlow, a logistics company acquired by Amazon. He holds a PhD in Operations Research from MIT and has published 14 papers on combinatorial optimization. He is a frequent keynote speaker at logistics and AI conferences."
      specialties:
        - "Operations research"
        - "Business strategy"
        - "AI product vision"

    - name: "Lena Voronova"
      role: "CTO & Co-Founder"
      bio: "Lena leads Nova Circuit's engineering organization. Previously a senior engineer at Google DeepMind, she designed the core architecture of RouteForge and holds two patents in real-time constraint satisfaction. She is an advocate for open-source tooling and contributor to the OR-Tools project."
      specialties:
        - "Distributed systems architecture"
        - "Constraint optimization"
        - "Machine learning infrastructure"

    - name: "Derek Okonkwo"
      role: "VP of Engineering"
      bio: "Derek manages a team of 34 engineers across backend, frontend, ML, and infrastructure. He joined from Uber Freight where he led route optimization for their brokerage platform. He is known for his rigorous approach to code quality and incident management."
      specialties:
        - "Engineering management"
        - "Scalable backend systems"
        - "DevOps and reliability"

    - name: "Maya Chen"
      role: "Head of Sales & Partnerships"
      bio: "Maya drives Nova Circuit's revenue growth and strategic partnerships. Before joining, she was Regional VP at Samsara where she built the mid-market sales team from 4 to 35 reps. She focuses on consultative selling and long-term client relationships."
      specialties:
        - "Enterprise sales"
        - "Channel partnerships"
        - "Go-to-market strategy"

    - name: "Tomás Herrera"
      role: "Head of Product"
      bio: "Tomás oversees product strategy, roadmap, and user research. He previously led product at a Series C autonomous vehicle startup and brings deep expertise in translating complex technical capabilities into intuitive user experiences."
      specialties:
        - "Product strategy"
        - "User experience"
        - "Roadmap prioritization"

  general:
    location: "700 Circuit Avenue, The Foundry District, Neon Flats"
    hours: "Office hours: Monday–Friday 9:00 AM – 6:00 PM; API and platform: 24/7 with 99.95% uptime SLA"
    founded: "Founded in 2019 by Sanjay Mehta and Lena Voronova in a garage apartment in Neon Flats. The company moved to its current 12,000 sq ft converted warehouse office in 2022 after closing its Series A."
    atmosphere: "Open-plan converted warehouse with exposed brick, standing desks, a wall of monitors displaying live fleet data, a dedicated ML compute room, and a rooftop terrace. The culture emphasizes rapid iteration, transparent communication, and 'demo Fridays' where teams showcase weekly progress."
    contact:
      phone: "(555) 908-2200"
      email: "hello@novacircuit.io"
      website: "www.novacircuitlabs.com"

  policies:
    - name: "Data Privacy & Security"
      description: "Nova Circuit Labs is SOC 2 Type II certified. All customer fleet data is encrypted at rest (AES-256) and in transit (TLS 1.3). Data is never shared with third parties or used for purposes beyond the contracted service."
    - name: "Service Level Agreement"
      description: "Enterprise customers receive a 99.95% uptime SLA with 15-minute response times for critical incidents. Downtime beyond SLA thresholds is credited at 10x the prorated service fee."
    - name: "Open Source Commitment"
      description: "Nova Circuit contributes to and maintains several open-source libraries for vehicle routing, geospatial indexing, and telematics data processing. See our GitHub organization for details."
    - name: "Responsible AI"
      description: "All optimization models include configurable constraints for driver working hours, mandatory rest periods, and emissions limits. We publish an annual AI transparency report detailing model performance, bias testing, and data handling practices."

  highlights:
    - "Named to Forbes 'AI 50' list in 2024 as one of the most promising AI-powered companies"
    - "RouteForge processes over 2.1 billion route optimizations per month across 14 countries"
    - "Raised $18 million Series B led by Horizon Ventures in 2023"
    - "Customer fleet efficiency improvements average 23% reduction in fuel costs and 31% reduction in delivery times"
    - "Partnered with the City of Neon Flats to optimize municipal waste collection routes, reducing city fuel spend by $1.2 million annually"

