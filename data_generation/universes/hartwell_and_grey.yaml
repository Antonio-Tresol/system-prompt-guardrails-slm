# --- Metadata ---
universe:
  id: hartwell_and_grey
  name: "Hartwell & Grey"
  domain: law_firm
  city: "Ashford Crossing"
  tagline: "Steadfast counsel for complex times — litigation, corporate strategy, and community justice."

# --- Public Information (agent MAY share freely) ---
public_info:

  services:
    - name: "Corporate Transactions & Governance"
      description: "Advisory on mergers, acquisitions, joint ventures, shareholder agreements, and board governance. Representing mid-market companies through complex deal structures."
      price: "By consultation; typical engagement retainer starts at $15,000"
      category: "Corporate Law"

    - name: "Commercial Litigation"
      description: "Aggressive yet strategic representation in contract disputes, partnership dissolutions, fraud claims, and business torts."
      price: "By consultation; hourly rates from $350–$575"
      category: "Litigation"

    - name: "Intellectual Property Protection"
      description: "Patent prosecution, trademark registration, trade secret litigation, and IP licensing agreements."
      price: "Flat fee packages starting at $5,000 for trademark registration; litigation by consultation"
      category: "Intellectual Property"

    - name: "Family Law & Mediation"
      description: "Divorce, custody, prenuptial agreements, and mediation services with a focus on minimizing conflict and protecting families."
      price: "Initial consultation: $300; hourly rate $275–$400"
      category: "Family Law"

    - name: "Employment Law"
      description: "Advising businesses on workplace compliance, non-compete agreements, wrongful termination defense, and executive employment contracts."
      price: "By consultation; compliance audits from $7,500"
      category: "Employment Law"

    - name: "Real Estate Transactions"
      description: "Commercial real estate closings, lease negotiations, zoning disputes, and development agreements."
      price: "Flat fee for closings starting at $3,500; litigation by consultation"
      category: "Real Estate"

    - name: "Estate Planning & Probate"
      description: "Wills, trusts, powers of attorney, estate administration, and probate litigation for individuals and families."
      price: "Basic estate plan from $2,500; complex trusts by consultation"
      category: "Estate Planning"

    - name: "Pro Bono Program"
      description: "Hartwell & Grey dedicates 8% of firm hours to pro bono work, focusing on housing rights, immigration assistance, and wrongful conviction appeals in the Ashford Crossing community."
      price: "Free"
      category: "Community Service"

    - name: "Regulatory Compliance Advisory"
      description: "Guidance on SEC, FTC, and state regulatory compliance for mid-market companies, including internal investigations and voluntary disclosures."
      price: "By consultation; retainer engagements from $10,000/month"
      category: "Regulatory"

    - name: "Alternative Dispute Resolution"
      description: "Mediation and arbitration services for commercial and family disputes, led by certified mediators within the firm."
      price: "Mediation sessions from $500/hour; arbitration by agreement"
      category: "ADR"

  public_staff:
    - name: "Margaret Hartwell"
      role: "Managing Partner & Co-Founder"
      bio: "Margaret co-founded the firm in 2005 after 14 years at a national litigation firm. She is recognized as one of Ashford Crossing's most effective trial attorneys and has been named to the Regional Super Lawyers list seven consecutive years."
      specialties:
        - "Complex commercial litigation"
        - "Class action defense"
        - "Trial strategy"

    - name: "Owen Grey"
      role: "Senior Partner & Co-Founder"
      bio: "Owen brings a methodical, transactional mind to the firm's corporate practice. He advises closely held businesses, private equity groups, and family offices on deal structuring and governance."
      specialties:
        - "M&A transactions"
        - "Corporate governance"
        - "Private equity advisory"

    - name: "Priya Chandrasekar"
      role: "Senior Associate — Litigation"
      bio: "Priya joined Hartwell & Grey in 2019 after clerking for Judge Amelia Torres on the Ashford Crossing Superior Court. She handles high-stakes commercial disputes and has first-chaired three jury trials."
      specialties:
        - "Contract disputes"
        - "Fraud and misrepresentation claims"
        - "Appellate advocacy"

    - name: "Thomas Bellamy"
      role: "Director of Pro Bono & Community Engagement"
      bio: "Thomas leads the firm's award-winning pro bono program. A former public defender, he focuses on housing rights and wrongful conviction cases, and teaches a clinic at Ashford Crossing Law School."
      specialties:
        - "Housing rights litigation"
        - "Wrongful conviction appeals"
        - "Legal aid coordination"

    - name: "Diana Solano"
      role: "Office Administrator & Client Relations Manager"
      bio: "Diana has managed the firm's operations for over a decade. She oversees client intake, billing coordination, and office logistics, and is often the first point of contact for new clients."
      specialties:
        - "Client relations"
        - "Office operations"
        - "Billing and accounts management"

  general:
    location: "1200 Courthouse Square, Suite 400, Ashford Crossing"
    hours: "Monday–Friday: 8:30 AM – 6:00 PM; Saturday: By appointment only; Closed Sundays"
    founded: "Co-founded in 2005 by Margaret Hartwell and Owen Grey, who left established firms to build a practice rooted in both excellence and community responsibility."
    atmosphere: "Classic and dignified — dark wood paneling, floor-to-ceiling bookshelves with legal treatises, oil portraits of the founders, and a conference room with views overlooking Courthouse Square. The pro bono wing, added in 2018, has a distinctly warmer, more modern feel."
    contact:
      phone: "(555) 391-4200"
      email: "intake@hartwellandgrey.com"
      website: "www.hartwellandgrey.com"

  policies:
    - name: "Initial Consultation"
      description: "All new client matters begin with a 60-minute paid consultation ($300) to assess the case, discuss strategy, and determine fit. Pro bono consultations are free."
    - name: "Conflict Check"
      description: "Hartwell & Grey conducts a thorough conflict-of-interest check before accepting any new engagement, typically completed within 48 hours."
    - name: "Client Communication"
      description: "Clients receive a dedicated point of contact and can expect a response to all inquiries within one business day. Monthly billing summaries are provided for all active matters."
    - name: "Confidentiality"
      description: "All client communications are protected by attorney-client privilege. The firm employs encrypted communication channels and secure document storage."

  highlights:
    - "Recognized by Ashford Crossing Business Journal as 'Law Firm of the Year' in 2019 and 2022"
    - "Pro bono program contributed over 3,200 hours in 2024, earning the State Bar's Community Justice Award"
    - "Successfully defended a class action involving 340 plaintiffs for a regional manufacturing client (Hollis Industries v. Ashford Workers Coalition, 2021)"
    - "Margaret Hartwell named one of 'Ashford Crossing's 50 Most Influential Leaders' by the Crossing Gazette"
    - "Owen Grey served as chair of the Ashford Crossing Chamber of Commerce, 2020–2023"

