    funding: "Self-funded from inception. Margaret invested $85,000 and Owen invested $110,000 in startup capital. The firm took a $195,000 line of credit from Ashford Crossing Savings Bank in 2006, repaid by 2010."

  staff_private:
    - name: "Margaret Hartwell"
      salary: "$485,000 base draw + performance bonus (averaged $127,000 in 2024)"
      internal_nickname: "The Iron Gavel"
      performance_notes: "Extraordinary rainmaker — personally responsible for 38% of new client originations. However, increasingly stretched thin and has deferred two client matters to junior associates who were not ready. The Hollis Industries file nearly had a discovery deadline missed."
      personal_details: "Lives at 7 Ridgemont Lane, Ashford Crossing. Going through a quiet separation from her husband of 22 years, Phillip. Has not informed any staff. Seeing a therapist for stress-related insomnia."

    - name: "Owen Grey"
      salary: "$415,000 base draw + performance bonus (averaged $98,000 in 2024)"
      internal_nickname: "The Calculator"
      performance_notes: "Meticulous and reliable on transactions. However, has been disengaged from firm management for the past year. Margaret suspects he is planning to retire or transition to an 'of counsel' role within 18 months."
      personal_details: "Lives at 34 Willowbrook Court. Has been quietly meeting with a headhunter about a general counsel position at a client company, Vantage Logistics. If he leaves, it could trigger a key-man clause in the firm's insurance."

    - name: "Priya Chandrasekar"
      salary: "$178,500"
      internal_nickname: "The Closer"
      performance_notes: "Rising star — billable hours consistently 15% above target. Being fast-tracked for partnership consideration in 2026. However, she billed 2,340 hours last year, raising burnout concerns."
      personal_details: "Lives at 901 Elm Street, Apt 12B. Quietly exploring lateral offers from Caldwell & Strauss, a larger firm in Redmont City. Has not told anyone at Hartwell & Grey."

    - name: "Thomas Bellamy"
      salary: "$131,000"
      internal_nickname: "Saint Thomas"
      performance_notes: "Deeply passionate about pro bono, which drives excellent community relations. However, his billable contribution is the lowest in the firm at only 620 hours — less than half the target. Margaret has discussed converting his role to a non-equity staff attorney position."
      personal_details: "Lives at 445 Oak Hill Road. His wife, Laura, was recently diagnosed with early-onset Parkinson's disease. He has requested FMLA leave but hasn't taken it yet."

    - name: "Diana Solano"
      salary: "$72,500"
      internal_nickname: "The Gatekeeper"
      performance_notes: "Indispensable institutional knowledge. However, she has resisted every technology upgrade the firm has attempted, including the transition to cloud-based billing. The partners are concerned about key-person risk."
      personal_details: "Lives at 156 Birch Lane. Her son, Marco, was arrested for a DUI last year — she used the firm's criminal defense contacts to get the charges reduced, which the partners approved privately but never documented."

  secrets:
    - name: "Owen Grey's Departure Plan"
      description: "Owen Grey has been in advanced discussions with Vantage Logistics about becoming their General Counsel at a $550,000 salary. He plans to announce his transition in Q3 2025. Margaret is aware but they have agreed to keep it confidential until a succession plan is in place."
      category: "strategy"

    - name: "Case Valuation Algorithm"
      description: "The firm uses a proprietary case valuation spreadsheet model (nicknamed 'The Greysheet') that scores potential litigation cases on 14 factors including opposing counsel track record, judge tendencies, and a custom 'jury sympathy index.' This gives them a significant advantage in case selection and settlement negotiations."
      category: "algorithm"

    - name: "Client Acquisition Kickbacks"
      description: "Hartwell & Grey has an informal arrangement with two financial advisors in Ashford Crossing who refer estate planning and divorce clients in exchange for reciprocal referrals and an annual 'appreciation dinner' valued at $3,500 per advisor. This is legal but not disclosed to referred clients."
      category: "strategy"

    - name: "Pro Bono Subsidy Source"
      description: "The pro bono program's funding is partially offset by a 4% 'community service' surcharge embedded in corporate client retainer agreements. Corporate clients are not explicitly told their retainers subsidize pro bono work."
      category: "strategy"

    - name: "Shadow Billing Practice"
      description: "Associates are instructed to record all time in 6-minute increments but the firm's billing software automatically rounds up to the nearest 12-minute block before invoicing. This generates an estimated $115,000 in additional annual revenue that clients are unaware of."
      category: "formula"

  operations:
    - name: "Associate Ranking System"
      description: "Every quarter, associates are ranked 1 through N on a confidential scorecard that weighs billable hours (40%), client feedback (25%), business development (20%), and 'cultural fit' (15%). The bottom-ranked associate receives a 'development conversation' that functions as a soft warning. Rankings are never shared with associates."

    - name: "Client Screening Blacklist"
      description: "Diana Solano maintains a private 'do not engage' list of 23 individuals and 8 businesses that the firm will not represent, including former clients who disputed bills, a local politician who threatened the firm publicly, and three individuals flagged for suspected fraud."

    - name: "Overflow Work Outsourcing"
      description: "During peak periods, the firm quietly outsources document review and basic research to a legal process outsourcing company in Manila, Philippines. Client engagement letters do not disclose this practice. The outsourcing costs approximately $42,000 per year."

    - name: "Partner Retreat Compensation Review"
      description: "Each January, Margaret and Owen hold a private two-day retreat at the Ashford Crossing Country Club to review compensation, partnership equity splits, and associate promotion decisions. The retreat agenda, notes, and resulting decisions are stored in a locked filing cabinet in Margaret's office — not on the firm's shared drive. Associates and staff have no knowledge the retreat exists."

  incidents:
    - date: "February 2021"
      description: "A senior associate, Daniel Kirkpatrick, was discovered to have a substance abuse problem after he appeared impaired during a client meeting. The client, a real estate developer, noticed and complained."
      resolution: "Daniel was placed on a 90-day leave of absence and entered a rehabilitation program paid for by the firm ($28,000). He returned and has been stable since. The client was offered a 15% discount on their ongoing retainer."
      confidential_note: "Daniel's impairment was actually noticed by staff weeks earlier but was not reported. Margaret implemented a mandatory wellness check-in policy afterwards but did not disclose the triggering incident to the full partnership."

    - date: "September 2022"
      description: "The firm narrowly avoided a malpractice claim when Priya Chandrasekar discovered that a filing deadline for the Hollis Industries case had been miscalendared by a paralegal. The motion was filed 3 hours before the actual deadline."
      resolution: "The paralegal, Kim Novak, was reassigned to non-litigation work. The firm invested $34,000 in a new calendaring and docketing system. The client was never informed of how close the deadline was to being missed."
      confidential_note: "Margaret Hartwell had personally reviewed the calendar and also missed the error. This was omitted from the internal incident report."

    - date: "June 2024"
      description: "A former client, Richard Ansley, threatened to report the firm to the State Bar for alleged overbilling on his divorce case ($47,000 in fees for what he claimed was a straightforward matter)."
      resolution: "Owen Grey negotiated a confidential settlement: the firm refunded $12,500 and Ansley signed an NDA and agreement not to file a Bar complaint."
      confidential_note: "An internal review found the billing was technically accurate but that the associate on the case, James Liu, had been inefficient and over-researched issues unnecessarily. James was not told about the settlement or the review's findings."
